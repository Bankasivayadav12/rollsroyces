      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#chartGrad)" />
  
  <!-- Subtle grid lines -->
