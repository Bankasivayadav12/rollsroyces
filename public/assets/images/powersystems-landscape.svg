<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87ceeb" />
      <stop offset="70%" stop-color="#d4eaf7" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="mtuBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#0044cc" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGrad)" />
  
  <!-- Low-Poly Mountains -->
  <polygon points="120,240 220,110 320,240" fill="#94a3b8" />
  <polygon points="220,110 280,180 320,240" fill="#cbd5e1" />
  <polygon points="220,110 240,140 220,145 200,140" fill="#ffffff" /> <!-- Snow cap -->

  <polygon points="280,240 380,80 480,240" fill="#64748b" />
  <polygon points="380,80 430,160 480,240" fill="#94a3b8" />
  <polygon points="380,80 410,120 380,130 350,120" fill="#ffffff" /> <!-- Snow cap -->

  <polygon points="440,240 540,120 640,240" fill="#475569" />
  <polygon points="540,120 590,170 640,240" fill="#cbd5e1" />
  <polygon points="540,120 560,150 540,155 520,150" fill="#ffffff" />

  <!-- Wind Turbines on ridge -->
  <line x1="570" y1="180" x2="570" y2="135" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="570" cy="135" r="3" fill="#ffffff" />
  <line x1="570" y1="135" x2="585" y2="120" stroke="#ffffff" stroke-width="2" />
  <line x1="570" y1="135" x2="555" y2="145" stroke="#ffffff" stroke-width="2" />

  <line x1="620" y1="195" x2="620" y2="155" stroke="#ffffff" stroke-width="2" />
  <circle cx="620" cy="155" r="2.5" fill="#ffffff" />
  <line x1="620" y1="155" x2="632" y2="142" stroke="#ffffff" stroke-width="1.8" />
  <line x1="620" y1="155" x2="608" y2="162" stroke="#ffffff" stroke-width="1.8" />

  <!-- Sea Area with Digital Grid Lines -->
  <polygon points="0,210 460,240 420,500 0,500" fill="url(#seaGrad)" />
  
  <!-- Perspective Sea Grid Lines -->
  <line x1="0" y1="280" x2="445" y2="280" stroke="#ffffff" stroke-width="0.8" opacity="0.3" />
  <line x1="0" y1="340" x2="435" y2="340" stroke="#ffffff" stroke-width="1" opacity="0.35" />
  <line x1="0" y1="410" x2="425" y2="410" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
  <line x1="100" y1="220" x2="60" y2="500" stroke="#ffffff" stroke-width="0.8" opacity="0.3" />
  <line x1="220" y1="225" x2="180" y2="500" stroke="#ffffff" stroke-width="0.8" opacity="0.35" />
  <line x1="340" y1="230" x2="300" y2="500" stroke="#ffffff" stroke-width="1" opacity="0.4" />

  <!-- Ships & Maritime Vessels -->
  <!-- Offshore Energy Platform -->
  <g transform="translate(60, 245)">
    <rect x="0" y="8" width="35" height="12" fill="#ef4444" rx="2" />
    <line x1="5" y1="8" x2="18" y2="-12" stroke="#f87171" stroke-width="1.8" />
    <line x1="30" y1="8" x2="18" y2="-12" stroke="#f87171" stroke-width="1.8" />
    <rect x="15" y="-18" width="6" height="6" fill="#fbbf24" />
  </g>

  <!-- Naval Vessel (Patrol Ship) -->
  <g transform="translate(140, 310)">
    <polygon points="0,15 50,15 65,5 15,5" fill="#475569" />
    <rect x="20" y="-4" width="22" height="10" fill="#94a3b8" />
    <rect x="28" y="-10" width="6" height="6" fill="#cbd5e1" />
    <path d="M0,15 Q-15,18 -25,22" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6" /> <!-- Wake -->
  </g>

  <!-- Container Cargo Ship -->
  <g transform="translate(230, 335)">
    <polygon points="0,20 85,20 100,5 15,5" fill="#1e293b" />
    <rect x="25" y="0" width="14" height="8" fill="#ef4444" />
    <rect x="42" y="0" width="14" height="8" fill="#3b82f6" />
    <rect x="59" y="0" width="14" height="8" fill="#10b981" />
    <rect x="76" y="-6" width="10" height="12" fill="#ffffff" />
    <path d="M0,20 Q-20,24 -35,30" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.7" /> <!-- Wake -->
  </g>

  <!-- Luxury Mega Yacht -->
  <g transform="translate(290, 410)">
    <polygon points="0,22 65,22 80,8 15,8" fill="#ffffff" />
    <polygon points="20,8 55,8 50,0 25,0" fill="#0f172a" />
    <polygon points="28,0 48,0 45,-5 32,-5" fill="#ffffff" />
    <path d="M0,22 Q-25,26 -45,35" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8" /> <!-- Wake -->
  </g>

  <!-- Land Area (Industrial & Power Infrastructure) -->
  <polygon points="460,240 800,200 800,500 420,500" fill="url(#landGrad)" />

  <!-- High-Speed Rail Viaduct & Train -->
  <path d="M490,235 Q600,225 720,215" stroke="#94a3b8" stroke-width="6" fill="none" />
  <path d="M520,231 Q580,226 640,221" stroke="#ffffff" stroke-width="4" fill="none" />
  <!-- Pillars -->
  <line x1="530" y1="234" x2="530" y2="255" stroke="#cbd5e1" stroke-width="3" />
  <line x1="580" y1="230" x2="580" y2="255" stroke="#cbd5e1" stroke-width="3" />
  <line x1="630" y1="225" x2="630" y2="255" stroke="#cbd5e1" stroke-width="3" />

  <!-- mtu Power Generation Microgrids & Battery Containers -->
  <g transform="translate(480, 360)">
    <!-- Generator Unit 1 -->
    <rect x="0" y="0" width="45" height="26" fill="#ffffff" rx="2" stroke="#0066ff" stroke-width="2" />
    <rect x="8" y="6" width="28" height="6" fill="#0066ff" />
    <circle cx="15" cy="18" r="3" fill="#64748b" />
    <circle cx="28" cy="18" r="3" fill="#64748b" />

    <!-- Generator Unit 2 -->
    <rect x="55" y="0" width="45" height="26" fill="#ffffff" rx="2" stroke="#0066ff" stroke-width="2" />
    <rect x="63" y="6" width="28" height="6" fill="#0066ff" />
    <circle cx="70" cy="18" r="3" fill="#64748b" />
    <circle cx="83" cy="18" r="3" fill="#64748b" />

    <!-- mtu Battery Storage Container -->
    <rect x="110" y="-15" width="55" height="35" fill="#f8fafc" rx="2" stroke="#0284c7" stroke-width="2" />
    <text x="122" y="5" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0284c7">mtu</text>
  </g>

  <!-- Heavy Mining Excavator & Truck -->
  <g transform="translate(680, 350)">
    <rect x="0" y="10" width="38" height="20" fill="#f59e0b" rx="2" />
    <rect x="22" y="2" width="14" height="10" fill="#1e293b" />
    <circle cx="8" cy="32" r="7" fill="#0f172a" />
    <circle cx="30" cy="32" r="7" fill="#0f172a" />
    <line x1="-15" y1="2" x2="0" y2="15" stroke="#f59e0b" stroke-width="5" />
    <polygon points="-24,0 -12,2 -16,10" fill="#475569" />
  </g>
</svg>
