<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="smrSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="60%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <radialGradient id="sunFlare" cx="60%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="480" fill="url(#smrSky)" />

  <!-- Distant Hills & Pylons -->
  <path d="M0,230 Q250,190 500,210 Q650,220 800,180 L800,480 L0,480 Z" fill="#bbf7d0" opacity="0.5" />
  
  <!-- Transmission Pylons in Distance -->
  <g transform="translate(620, 160)" stroke="#64748b" stroke-width="1.5" opacity="0.6">
    <line x1="15" y1="0" x2="15" y2="45" />
    <line x1="5" y1="12" x2="25" y2="12" />
    <line x1="8" y1="22" x2="22" y2="22" />
    <line x1="15" y1="0" x2="0" y2="45" />
    <line x1="15" y1="0" x2="30" y2="45" />
  </g>
  <g transform="translate(710, 150)" stroke="#64748b" stroke-width="1.5" opacity="0.5">
    <line x1="15" y1="0" x2="15" y2="45" />
    <line x1="5" y1="12" x2="25" y2="12" />
    <line x1="8" y1="22" x2="22" y2="22" />
    <line x1="15" y1="0" x2="0" y2="45" />
    <line x1="15" y1="0" x2="30" y2="45" />
  </g>

  <!-- Main SMR Reactor Building (Curved Futuristic Shield Canopy) -->
  <g transform="translate(260, 120)">
    <!-- Base podium -->
    <polygon points="-60,140 320,130 350,175 -90,185" fill="#e2e8f0" stroke="#cbd5e1" />
    <rect x="-50" y="145" width="360" height="25" fill="#0f172a" opacity="0.8" />
    <!-- Glass mullions -->
    <line x1="-30" y1="145" x2="-30" y2="170" stroke="#38bdf8" stroke-width="2" />
    <line x1="20" y1="145" x2="20" y2="170" stroke="#38bdf8" stroke-width="2" />
    <line x1="70" y1="145" x2="70" y2="170" stroke="#38bdf8" stroke-width="2" />
    <line x1="120" y1="145" x2="120" y2="170" stroke="#38bdf8" stroke-width="2" />
    <line x1="170" y1="145" x2="170" y2="170" stroke="#38bdf8" stroke-width="2" />
    <line x1="220" y1="145" x2="220" y2="170" stroke="#38bdf8" stroke-width="2" />

    <!-- Main Aerodynamic SMR Reactor Canopy Dome -->
    <path d="M-10,135 Q10,40 120,25 Q230,10 260,70 Q280,110 260,130 Z" fill="url(#domeGrad)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Facet reflection line -->
    <path d="M40,35 Q140,25 210,60 Q235,95 215,130" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" />
    <polygon points="120,25 240,65 210,130 90,135" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- Green Earth Berms and Landscaping -->
  <path d="M0,280 Q250,220 540,240 Q750,250 800,280 L800,480 L0,480 Z" fill="url(#grassGrad)" />
  <path d="M0,320 Q350,280 600,300 Q800,310 800,480 L0,480 Z" fill="#4d7c0f" opacity="0.4" />

  <!-- Curved Access Road -->
  <path d="M120,480 Q220,380 400,340 Q550,310 700,320 Q800,330 800,360 L800,400 Q700,360 550,350 Q380,380 200,480 Z" fill="#94a3b8" />
  <path d="M130,480 Q225,385 400,345 Q550,315 700,325 Q800,335 800,370" fill="none" stroke="#ffffff" stroke-dasharray="8 8" stroke-width="2" opacity="0.7" />

  <!-- Red Electric Vehicle on Road -->
  <g transform="translate(240, 395) scale(0.65)">
    <rect x="0" y="0" width="36" height="18" rx="5" fill="#ef4444" />
    <polygon points="6,3 12,-6 26,-6 32,3" fill="#1e293b" />
    <circle cx="8" cy="18" r="4.5" fill="#0f172a" />
    <circle cx="28" cy="18" r="4.5" fill="#0f172a" />
  </g>

  <!-- Luscious Trees Lining the Parkway -->
  <g fill="#166534">
    <circle cx="180" cy="350" r="22" />
    <circle cx="195" cy="340" r="18" fill="#15803d" />
    <line x1="180" y1="365" x2="180" y2="390" stroke="#78350f" stroke-width="4" />

    <circle cx="280" cy="315" r="24" />
    <circle cx="295" cy="305" r="20" fill="#15803d" />
    <line x1="280" y1="330" x2="280" y2="355" stroke="#78350f" stroke-width="4" />

    <circle cx="390" cy="290" r="22" />
    <circle cx="405" cy="280" r="18" fill="#15803d" />
    <line x1="390" y1="305" x2="390" y2="330" stroke="#78350f" stroke-width="4" />

    <circle cx="500" cy="275" r="20" />
    <circle cx="512" cy="268" r="16" fill="#15803d" />
    <line x1="500" y1="288" x2="500" y2="310" stroke="#78350f" stroke-width="3.5" />

    <circle cx="600" cy="285" r="18" />
    <circle cx="610" cy="278" r="15" fill="#15803d" />
    <line x1="600" y1="298" x2="600" y2="320" stroke="#78350f" stroke-width="3" />

    <circle cx="680" cy="305" r="20" />
    <circle cx="692" cy="298" r="16" fill="#15803d" />
    <line x1="680" y1="318" x2="680" y2="340" stroke="#78350f" stroke-width="3.5" />
  </g>

  <!-- Sun Flare Optical Glow -->
  <circle cx="450" cy="180" r="160" fill="url(#sunFlare)" />
  <circle cx="480" cy="210" r="16" fill="#ec4899" opacity="0.4" />
  <circle cx="520" cy="240" r="28" fill="#8b5cf6" opacity="0.25" />
</svg>
